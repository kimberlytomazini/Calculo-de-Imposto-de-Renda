<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Imposto de Renda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cálculo de Imposto de Renda</h2>

        <form onsubmit="calcularIR(); return false;">
            <label>Registro:</label>
            <input type="number" id="registro" required>

            <label>Nome:</label>
            <input type="text" id="nome" required>

            <label>Salário (R$):</label>
            <input type="number" id="salario" required>

            <input type="submit" value="Calcular IR">

            <label>Imposto de Renda:</label>
            <input type="text" id="imposto" readonly>
        </form>
    </div>

    <script>
        function calcularIR() {
            const salario = parseFloat(document.getElementById("salario").value);
            const campoImposto = document.getElementById("imposto");
            let aliquota, imposto;

            if (isNaN(salario) || salario <= 0) {
                alert("Por favor, digite um salário válido.");
                return;
            }

            if (salario <= 1434) {
                aliquota = 0;
            } else if (salario <= 2150) {
                aliquota = 7.5;
            } else if (salario <= 2866) {
                aliquota = 15;
            } else if (salario <= 3582) {
                aliquota = 22.5;
            } else {
                aliquota = 27.5;
            }

            imposto = salario * (aliquota / 100);
            campoImposto.value = `R$ ${imposto.toFixed(2)} (${aliquota}% de IR)`;
        }
    </script>
</body>
</html>
